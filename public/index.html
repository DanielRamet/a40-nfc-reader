<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <title>Drunk Meter</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.png">

</head>

<body>

    <!-- Enlace a la aplicación en la esquina superior izquierda -->
    <div style="position: absolute; top: 10px; left: 10px;">
        <a href="https://a40-nfc-reader.web.app/" style="text-decoration: none; color: white; font-size: 16px;">
            https://a40-nfc-reader.web.app/
        </a>
    </div>

    <!-- Pantalla de bienvenida / Splash Screen -->
    <div id="splashScreen" class="splash">
        <img src="assets/chibi1.jpg" alt="Chibi Character" class="chibi-splash">
    </div>

    <h1>🍻 ¡ BORRACHÓMETRO ! </h1>

    <div id="globalCounter">

        TOTAL BEBIDAS

        <div id="totalScans">
            0
        </div>

    </div>

    <div id="podium">

        <div class="podium-slot" id="second">
            <h2>🥈</h2>
            <div class="name"></div>
            <div class="score"></div>
        </div>

        <div class="podium-slot" id="first">
            <h2>🥇</h2>
            <div class="name"></div>
            <div class="score"></div>
        </div>

        <div class="podium-slot" id="third">
            <h2>🥉</h2>
            <div class="name"></div>
            <div class="score"></div>
        </div>

    </div>

    <!-- Encabezado del ranking con avatar chibi -->
    <div class="ranking-header">
        <img src="assets/chibi1.jpg" alt="Reina del Brindis" class="chibi-avatar">
        <span>Reina del Brindis</span>
        <h2>Ranking</h2>
    </div>

    <div id="tableContainer">

        <table>

            <thead>

                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Bebidas</th>
                    <th>Última</th>
                </tr>

            </thead>

            <tbody id="tableBody"></tbody>

        </table>

    </div>

    <div id="scanNotification"></div>

    <!-- Modal para notificaciones NFC -->
    <div id="modalOverlay" class="modal-hidden">
        <div class="modal">
            <img src="assets/chibi1.jpg" alt="Chibi" class="chibi-modal">
            <p class="modal-message"></p>
        </div>
    </div>

    <script type="module" src="app.js"></script>

</body>

</html>
