<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drunk Meter - AsunFest</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.png">

</head>

<body>

    <!-- Splash Screen de bienvenida con animación tipo GIF -->
    <div id="splashScreen">
        <img id="splashChibi" src="assets/chibi1.jpg" alt="AsunFest Chibi" class="splash-chibi">
        <h2>¡Preparando el Borrachómetro!</h2>
    </div>

    <!-- Enlace a la aplicación en la esquina superior izquierda -->
    <div class="top-link">
        <a href="https://a40-nfc-reader.web.app/">
            https://a40-nfc-reader.web.app/
        </a>
    </div>

    <h1>🍻 ¡ BORRACHÓMETRO ! </h1>

    <div id="globalCounter">

        TOTAL BEBIDAS

        <div id="totalScans">
            0
        </div>

    </div>

    <div id="podium">

        <div class="podium-slot" id="second">
            <h2>🥈</h2>
            <div class="name"></div>
            <div class="score"></div>
        </div>

        <div class="podium-slot" id="first">
            <h2>🥇</h2>
            <div class="name"></div>
            <div class="score"></div>
        </div>

        <div class="podium-slot" id="third">
            <h2>🥉</h2>
            <div class="name"></div>
            <div class="score"></div>
        </div>

    </div>

    <!-- Encabezado del ranking con Avatar y Título -->
    <div class="ranking-header">
        <img src="assets/chibi1.jpg" alt="Avatar Chibi" class="ranking-avatar">
        <div class="ranking-title-group">
            <h2>Ranking</h2>
            <span class="reina-brindis-title">👑 Reina del Brindis 👑</span>
        </div>
    </div>

    <div id="tableContainer">

        <table>

            <thead>

                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Bebidas</th>
                    <th>Última</th>
                </tr>

            </thead>

            <tbody id="tableBody"></tbody>

        </table>

    </div>

    <div id="scanNotification"></div>

    <!-- Modal para notificaciones NFC -->
    <div id="modalOverlay" class="modal-hidden">
        <div class="modal">
            <img id="modalChibi" src="assets/chibi1.jpg" alt="Chibi" class="chibi-modal modal-chibi-img">
            <p class="modal-message"></p>
        </div>
    </div>

    <script type="module" src="app.js"></script>

</body>

</html>
